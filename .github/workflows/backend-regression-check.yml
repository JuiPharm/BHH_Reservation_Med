name: Backend auth regression checks

on:
  pull_request:
    paths:
      - 'backend/ApiRouter.gs'
      - 'backend/AuthService.gs'
      - 'backend/SessionService.gs'
      - 'backend/SecurityService.gs'
      - 'backend/V2*.gs'
      - 'tests/backend/api-contract.test.js'
      - 'tests/backend/auth-throttle.test.js'
      - 'tests/backend/pin-hash-runtime.test.js'
      - 'tests/backend/security.test.js'
      - 'tests/backend/session-idle.test.js'
      - 'tests/backend/v2-user-bootstrap.test.js'
      - 'tests/backend/v2-health-contract.test.js'
      - '.github/workflows/backend-regression-check.yml'

permissions:
  contents: read

jobs:
  backend-auth-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run auth and API regression suite
        run: >-
          node --test
          tests/backend/api-contract.test.js
          tests/backend/auth-throttle.test.js
          tests/backend/pin-hash-runtime.test.js
          tests/backend/security.test.js
          tests/backend/session-idle.test.js
          tests/backend/v2-user-bootstrap.test.js
          tests/backend/v2-health-contract.test.js
