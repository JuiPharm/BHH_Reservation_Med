<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>เข้าสู่ระบบ | ระบบจองยาเฉพาะราย</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/auth.css"></head>
<body>
<a class="skip-link" href="#main-content">ข้ามไปเนื้อหาหลัก</a>
<header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><img class="brand-logo" src="assets/logo-placeholder.svg" alt="โลโก้ระบบจองยาเฉพาะราย"><span class="brand-fallback" hidden>ระบบจองยาเฉพาะราย</span><span>ระบบจองยาเฉพาะราย</span></a><nav class="site-nav" aria-label="เมนูหลัก"><a href="index.html">หน้าหลัก</a><button type="button" class="secondary" data-action="logout">ออกจากระบบ</button></nav><div class="identity" aria-label="ข้อมูลผู้ใช้"><span id="identity-name">—</span><span id="identity-staff-id">—</span><span id="identity-department">—</span><span id="identity-role">—</span></div></div></header>
<main id="main-content" class="auth-layout" tabindex="-1"><section class="panel auth-panel" aria-labelledby="login-title"><h1 id="login-title" class="page-title">เข้าสู่ระบบ</h1><p>ใช้รหัสเจ้าหน้าที่และรหัส PIN ที่ได้รับจากหน่วยงาน</p><form id="login-form" novalidate><div class="field"><label for="staff-id">รหัสเจ้าหน้าที่</label><input id="staff-id" name="staff-id" type="text" autocomplete="username" inputmode="text" required aria-describedby="staff-id-error"><span id="staff-id-error" data-field-error="staff-id" role="alert"></span></div><div class="field"><label for="pin">รหัส PIN</label><input id="pin" name="pin" type="password" autocomplete="current-password" required aria-describedby="pin-error"><span id="pin-error" data-field-error="pin" role="alert"></span></div><button type="submit">เข้าสู่ระบบ</button></form></section><p id="page-loading" class="status-message" role="status" aria-live="polite" hidden></p><p id="page-error" class="error-message" role="alert" aria-live="assertive"></p></main>
<footer class="site-footer">ระบบสำหรับเจ้าหน้าที่ผู้ได้รับอนุญาตเท่านั้น</footer><div id="toast-region" role="status" aria-live="polite" hidden></div><script type="module" src="js/auth.js"></script>
</body>
</html>
