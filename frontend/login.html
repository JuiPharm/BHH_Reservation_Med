<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>เข้าสู่ระบบ | BHH Medication Reservation</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/auth.css"></head>
<body>
<main id="main-content" class="auth-layout" tabindex="-1">
  <div class="auth-shell">
    <section class="auth-brand-panel" aria-label="ข้อมูลระบบ">
      <span class="auth-brand-kicker">Bangkok Hospital Hat Yai</span>
      <img class="brand-logo" src="assets/bdms-bhh-logo.svg" alt="Bangkok Hospital Hat Yai Medication Reservation">
      <h1>ระบบจองยาเฉพาะราย</h1>
      <p>Medication Reservation & Fulfillment สำหรับติดตามคำขอ การจัดหา ยาพร้อม และการรับยาของผู้รับบริการอย่างเป็นระบบ</p>
    </section>
    <section class="auth-panel" aria-labelledby="login-title">
      <h2 id="login-title">เข้าสู่ระบบ</h2>
      <p class="subtitle">ใช้รหัสเจ้าหน้าที่และ PIN ที่ได้รับจากหน่วยงาน</p>
      <form id="login-form" novalidate>
        <div class="field"><label for="staff-id">รหัสเจ้าหน้าที่</label><input id="staff-id" name="staff-id" type="text" autocomplete="username" required aria-describedby="staff-id-error" placeholder="Staff ID"><span id="staff-id-error" data-field-error="staff-id" role="alert"></span></div>
        <div class="field"><label for="pin">รหัส PIN</label><input id="pin" name="pin" type="password" autocomplete="current-password" required aria-describedby="pin-error" placeholder="PIN"><span id="pin-error" data-field-error="pin" role="alert"></span></div>
        <button type="submit">เข้าสู่ระบบ</button>
      </form>
      <div class="auth-security-note"><span aria-hidden="true">🔒</span><span>ระบบสำหรับเจ้าหน้าที่ที่ได้รับอนุญาต ข้อมูลผู้รับบริการจะแสดงตามสิทธิ์การใช้งาน</span></div>
      <p id="page-loading" class="status-message" role="status" aria-live="polite" hidden></p><p id="page-error" class="error-message" role="alert" aria-live="assertive"></p>
    </section>
  </div>
</main>
<div id="toast-region" role="status" aria-live="polite" hidden></div><script type="module" src="js/auth.js"></script>
</body></html>
