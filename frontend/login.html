<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>เข้าสู่ระบบ | ระบบจองยาเฉพาะราย</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/auth.css"></head>
<body>
<main id="main-content" class="auth-layout" tabindex="-1">
  <div style="text-align: center; margin-bottom: 2rem; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
    <img src="assets/logo-placeholder.svg" alt="โลโก้ระบบจองยาเฉพาะราย" style="height: 4rem; width: auto; border-radius: 0.8rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <span style="font-size: 1.5rem; font-weight: 800; color: var(--primary-dark); letter-spacing: -0.02em;">ระบบจองยาเฉพาะราย</span>
  </div>
  <section class="panel auth-panel" aria-labelledby="login-title"><h1 id="login-title" class="page-title">เข้าสู่ระบบ</h1><p>ใช้รหัสเจ้าหน้าที่และรหัส PIN ที่ได้รับจากหน่วยงาน</p><form id="login-form" novalidate><div class="field"><label for="staff-id">รหัสเจ้าหน้าที่</label><input id="staff-id" name="staff-id" type="text" autocomplete="username" inputmode="text" required aria-describedby="staff-id-error"><span id="staff-id-error" data-field-error="staff-id" role="alert"></span></div><div class="field"><label for="pin">รหัส PIN</label><input id="pin" name="pin" type="password" autocomplete="current-password" required aria-describedby="pin-error"><span id="pin-error" data-field-error="pin" role="alert"></span></div><button type="submit">เข้าสู่ระบบ</button></form></section><p id="page-loading" class="status-message" role="status" aria-live="polite" hidden></p><p id="page-error" class="error-message" role="alert" aria-live="assertive"></p></main>
<footer class="site-footer">ระบบสำหรับเจ้าหน้าที่ผู้ได้รับอนุญาตเท่านั้น</footer><div id="toast-region" role="status" aria-live="polite" hidden></div><script type="module" src="js/auth.js"></script>
</body>
</html>
