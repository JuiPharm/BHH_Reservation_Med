<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>รายละเอียดสำหรับผู้ดูแล | ระบบจองยาเฉพาะราย</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/order.css"><link rel="stylesheet" href="css/admin.css"></head>
<body data-requires-auth="true">

<header class="site-header"><div class="header-inner"><a class="brand" href="admin.html"><img class="brand-logo" src="assets/logo-placeholder.svg" alt="โลโก้ระบบจองยาเฉพาะราย"><span class="brand-fallback" hidden>ระบบจองยาเฉพาะราย</span><span>ระบบจองยาเฉพาะราย</span></a><nav class="site-nav" aria-label="เมนูหลัก"><a href="dashboard.html">แดชบอร์ด</a><a href="admin.html">ผู้ดูแลระบบ</a><button type="button" class="secondary" data-action="logout">ออกจากระบบ</button></nav><div class="identity" aria-label="ข้อมูลผู้ใช้"><span id="identity-name">—</span><span id="identity-staff-id">—</span><span id="identity-department">—</span><span id="identity-role">—</span></div></div></header>
<main id="main-content" tabindex="-1"><section id="admin-order-detail" class="panel"><h1 class="page-title">รับยาและแจ้งเตือน</h1><div id="admin-order-summary" aria-live="polite"></div><section id="cancellation-decision" aria-labelledby="cancellation-decision-heading" hidden><h2 id="cancellation-decision-heading">พิจารณาคำขอยกเลิก</h2><label for="cancellation-decision-reason">เหตุผลประกอบการตัดสินใจ</label><textarea id="cancellation-decision-reason" maxlength="1000"></textarea><div class="form-actions"><button id="approve-cancellation" type="button">อนุมัติการยกเลิก</button><button id="reject-cancellation" class="secondary" type="button">ปฏิเสธและคืนสถานะเดิม</button></div><p id="cancellation-decision-result" role="status" aria-live="polite"></p></section><form id="received-items-form" class="workflow-form" novalidate><div id="received-items" class="received-items"></div><button type="submit">บันทึกการรับยา</button></form><section class="admin-email-section" aria-labelledby="email-heading"><h2 id="email-heading">แจ้งการรับยา</h2><p>ส่งได้เมื่อคำขอมีสถานะรับครบแล้ว</p><button id="send-order-email" type="button">ส่งอีเมลแจ้งการรับยา</button><p id="email-result" role="status" aria-live="polite"></p></section></section><p id="page-loading" class="status-message" role="status" aria-live="polite" hidden></p><p id="page-error" class="error-message" role="alert" aria-live="assertive"></p></main>
