<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>รายละเอียดคำขอ | ระบบจองยาเฉพาะราย</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/order.css"></head>
<body data-requires-auth="true">
<a class="skip-link" href="#main-content">ข้ามไปเนื้อหาหลัก</a>
<header class="site-header"><div class="header-inner"><a class="brand" href="dashboard.html"><img class="brand-logo" src="assets/logo-placeholder.svg" alt="โลโก้ระบบจองยาเฉพาะราย"><span class="brand-fallback" hidden>ระบบจองยาเฉพาะราย</span><span>ระบบจองยาเฉพาะราย</span></a><nav class="site-nav" aria-label="เมนูหลัก"><a href="dashboard.html">แดชบอร์ด</a><a href="new-order.html">สร้างคำขอ</a><button type="button" class="secondary" data-action="logout">ออกจากระบบ</button></nav><div class="identity" aria-label="ข้อมูลผู้ใช้"><span id="identity-name">—</span><span id="identity-staff-id">—</span><span id="identity-department">—</span><span id="identity-role">—</span></div></div></header>
<main id="main-content" tabindex="-1"><section id="order-detail" class="panel"><h1 class="page-title">รายละเอียดคำขอ</h1><p>เปิดแต่ละส่วนเพื่อโหลดข้อมูลล่าสุดตามสิทธิ์ของคุณ</p><p><a id="edit-order-link" href="edit-order.html">แก้ไขคำขอ</a></p><div id="order-summary" aria-live="polite"></div><details id="order-items-panel" class="order-detail-section"><summary>รายการยา</summary><ul id="order-items" class="plain-list"></ul></details><details id="order-log-panel" class="order-detail-section"><summary>ประวัติการเปลี่ยนแปลง</summary><ul id="order-change-log" class="plain-list"></ul></details><details class="order-detail-section"><summary>ขอยกเลิกคำขอ</summary><form id="cancel-order-form" class="workflow-form" novalidate><label for="cancel-reason">เหตุผลการยกเลิก</label><select id="cancel-reason" name="ReasonCode" required><option value="">เลือกเหตุผล</option><option value="PATIENT_CANCELLED">ผู้ป่วยยกเลิก</option><option value="TREATMENT_CHANGED">เปลี่ยนแผนการรักษา</option><option value="MEDICATION_CHANGED">เปลี่ยนยา</option><option value="TRANSFERRED">ย้ายสถานพยาบาล</option><option value="DUPLICATE_ORDER">คำขอซ้ำ</option><option value="DECEASED">เสียชีวิต</option><option value="OTHER">อื่น ๆ</option></select><span data-field-error="ReasonCode" role="alert"></span><label for="cancel-reason-detail">รายละเอียดเพิ่มเติมเมื่อเลือกอื่น ๆ</label><textarea id="cancel-reason-detail" name="ReasonDetail" maxlength="1000"></textarea><span data-field-error="ReasonDetail" role="alert"></span><button type="submit">ส่งคำขอยกเลิก</button></form></details></section><p id="page-loading" class="status-message" role="status" aria-live="polite" hidden></p><p id="page-error" class="error-message" role="alert" aria-live="assertive"></p></main>
<footer class="site-footer">ระบบสำหรับเจ้าหน้าที่ผู้ได้รับอนุญาตเท่านั้น</footer><div id="toast-region" role="status" aria-live="polite" hidden></div><script type="module" src="js/auth.js"></script><script type="module" src="js/order-detail.js"></script>
