<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>แก้ไขคำขอ | ระบบจองยาเฉพาะราย</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/order.css"></head>

<header class="site-header"><div class="header-inner"><a class="brand" href="dashboard.html"><img class="brand-logo" src="assets/logo-placeholder.svg" alt="โลโก้ระบบจองยาเฉพาะราย"><span class="brand-fallback" hidden>ระบบจองยาเฉพาะราย</span><span>ระบบจองยาเฉพาะราย</span></a><nav class="site-nav" aria-label="เมนูหลัก"><a href="dashboard.html">แดชบอร์ด</a><a href="new-order.html">สร้างคำขอ</a><button type="button" class="secondary" data-action="logout">ออกจากระบบ</button></nav><div class="identity" aria-label="ข้อมูลผู้ใช้"><span id="identity-name">—</span><span id="identity-staff-id">—</span><span id="identity-department">—</span><span id="identity-role">—</span></div></div></header>
<main id="main-content" tabindex="-1"><section class="panel"><h1 class="page-title">แก้ไขคำขอ</h1><aside id="version-conflict" class="conflict-message" role="alert" hidden><p></p><button type="button" class="secondary">โหลดข้อมูลล่าสุด</button></aside><form id="edit-order-form" class="workflow-form" novalidate><div class="form-grid"><label>โทรศัพท์ผู้ติดต่อ<input name="RequesterPhone" type="tel" autocomplete="tel"></label><label>HN<input name="HN" inputmode="numeric" autocomplete="off" required><span data-field-error="HN" role="alert"></span></label><label>ชื่อผู้รับบริการ<input name="PatientName" autocomplete="off" required><span data-field-error="PatientName" role="alert"></span></label><label>หอผู้ป่วย/คลินิก<input name="WardClinic" autocomplete="off"></label><label>วันที่ต้องการ<input name="RequiredDate" type="date" required><span data-field-error="RequiredDate" role="alert"></span></label><label>ความสำคัญ<select name="Priority"></select><span data-field-error="Priority" role="alert"></span></label></div><fieldset><legend>รายการยา</legend><div data-medication-items class="medication-items"></div><button type="button" class="secondary" data-add-medication>เพิ่มรายการยา</button><span data-field-error="Items" role="alert"></span></fieldset><div class="form-actions"><button type="submit">บันทึกการแก้ไข</button><a href="dashboard.html">ยกเลิก</a></div></form></section><p id="page-loading" class="status-message" role="status" aria-live="polite" hidden></p><p id="page-error" class="error-message" role="alert" aria-live="assertive"></p></main>
